<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Rekap Bulanan - SISEKA WASI'I</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-tenant">
  <div class="page-container" style="padding-bottom:40px;">
    <!-- Top Bar with Back -->
    <header style="position:sticky;top:0;z-index:40;background:rgba(241,245,249,0.95);backdrop-filter:blur(16px);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(192,201,192,0.3);">
      <a href="rekap.html" style="padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-surface);background:#ffffff;box-shadow:var(--shadow-sm);text-decoration:none;">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <div>
        <h1 class="font-bold" style="font-size:16px;color:var(--on-surface);" id="headerMonthTitle">Rekap Bulanan</h1>
        <p class="text-xs text-muted" id="headerKioskTitle">Kantin</p>
      </div>
    </header>

    <main style="padding:20px 16px;">
      <!-- Summary Card (Clean Horizontal Layout) -->
      <div class="card" style="border-radius:24px;padding:20px;margin-bottom:24px;background:#ffffff;box-shadow:var(--shadow-sm);border:1px solid rgba(192,201,192,0.3);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div>
            <p style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;">AKUMULASI SETORAN</p>
            <h2 style="font-size:26px;font-weight:800;color:#003820;margin-top:2px;" id="totalAkumulasiText">Rp 0</h2>
          </div>
          <div id="recapBadgeWrapper">
            <span style="background:#003820;color:#ffffff;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="font-size:16px;">check_circle</span> Lunas
            </span>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;margin-bottom:14px;">
          <div>
            <p style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">BIAYA SEWA</p>
            <p style="font-size:14px;font-weight:800;color:#334155;" id="tarifSewaText">Rp 0</p>
          </div>
          <div>
            <p style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">HARI AKTIF</p>
            <p style="font-size:14px;font-weight:800;color:#003820;" id="hariAktifText">0 Hari</p>
          </div>
          <div id="summaryHighlightBox">
            <div style="background:#f0fdf4;border:1px solid #dcfce7;border-radius:12px;padding:8px 10px;text-align:left;">
              <p style="font-size:10px;font-weight:700;color:#047857;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">STATUS</p>
              <p style="font-size:13px;font-weight:800;color:#047857;" id="highlightStatusText">Lunas</p>
            </div>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b;font-weight:500;">
          <span class="material-symbols-outlined" style="font-size:16px;">info</span>
          <span id="hariLiburInfoText">0 Hari Libur / Tutup</span>
        </div>
      </div>

      <!-- Daily List -->
      <h3 class="font-bold text-sm mb-3" style="color:var(--on-surface);">Rincian Harian</h3>
      <div class="card card--flush space-y-1" id="dailyListContainer">
        <div style="text-align:center;padding:24px;color:var(--on-surface-variant);">Memuat rincian harian...</div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/components.js"></script>
  <script>
    const user = requireAuth('tenant');

    const urlParams = new URLSearchParams(window.location.search);
    const month = urlParams.get('month') || '2026-08';

    async function loadTenantMonthDetail() {
      const token = getAuthToken();
      try {
        const res = await fetch(`${API_BASE_URL}/recap/tenant/month-detail?month=${month}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();

        if (result.success) {
          renderTenantMonthDetail(result);
        } else {
          fallbackLocalDetail();
        }
      } catch (err) {
        console.warn('Backend offline, fallback lokal:', err);
        fallbackLocalDetail();
      }
    }

    function fallbackLocalDetail() {
      renderTenantMonthDetail({
        kiosk: { nama_kantin: user.kios || 'Kantin Berkah', tarif_sewa: 1000000 },
        bulan_label: 'Agustus 2026',
        summary: {
          total_setor: 850000,
          tarif_sewa: 1000000,
          progress_percent: 85,
          kekurangan: 150000,
          hari_aktif: 17,
          hari_libur: 2,
          status: 'berjalan'
        },
        riwayat: TENANT_RIWAYAT
      });
    }

    function renderTenantMonthDetail(data) {
      const { kiosk, summary, riwayat, bulan_label } = data;

      document.getElementById('headerMonthTitle').textContent = `Rekap ${bulan_label}`;
      document.getElementById('headerKioskTitle').textContent = kiosk.nama_kantin || 'Kantin';

      document.getElementById('totalAkumulasiText').textContent = formatRupiah(summary.total_setor);
      document.getElementById('tarifSewaText').textContent = formatRupiah(summary.tarif_sewa);
      document.getElementById('hariAktifText').textContent = `${summary.hari_aktif} Hari`;
      document.getElementById('hariLiburInfoText').textContent = `${summary.hari_aktif} Hari Aktif Setor • ${summary.hari_libur} Hari Libur`;

      const badgeWrapper = document.getElementById('recapBadgeWrapper');
      const highlightBox = document.getElementById('summaryHighlightBox');

      if (summary.status === 'surplus' || summary.status === 'lunas') {
        badgeWrapper.innerHTML = `
          <span style="background:#003820;color:#ffffff;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
            <span class="material-symbols-outlined" style="font-size:16px;">check_circle</span> Lunas (Surplus)
          </span>
        `;
        highlightBox.innerHTML = `
          <div style="background:#f0fdf4;border:1px solid #dcfce7;border-radius:12px;padding:8px 10px;text-align:left;">
            <p style="font-size:10px;font-weight:700;color:#047857;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">SALDO</p>
            <p style="font-size:13px;font-weight:800;color:#047857;">+${formatRupiahShort(summary.selisih || 0)}</p>
          </div>
        `;
      } else if (summary.status === 'berjalan') {
        badgeWrapper.innerHTML = `
          <span style="background:#f0fdf4;color:#047857;border:1px solid #bbf7d0;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
            <span class="material-symbols-outlined" style="font-size:16px;">schedule</span> Berjalan (${summary.progress_percent}%)
          </span>
        `;
        highlightBox.innerHTML = `
          <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px 10px;text-align:left;">
            <p style="font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">SISA</p>
            <p style="font-size:13px;font-weight:800;color:#003820;">${formatRupiahShort(summary.kekurangan || 0)}</p>
          </div>
        `;
      } else {
        badgeWrapper.innerHTML = `
          <span style="background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
            <span class="material-symbols-outlined" style="font-size:16px;">error_outline</span> Kurang ${formatRupiahShort(Math.abs(summary.selisih))}
          </span>
        `;
        highlightBox.innerHTML = `
          <div style="background:#fef2f2;border:1px solid #fee2e2;border-radius:12px;padding:8px 10px;text-align:left;">
            <p style="font-size:10px;font-weight:700;color:#b91c1c;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">SELISIH</p>
            <p style="font-size:13px;font-weight:800;color:#b91c1c;">-${formatRupiahShort(Math.abs(summary.selisih))}</p>
          </div>
        `;
      }

      const container = document.getElementById('dailyListContainer');
      if (!riwayat || riwayat.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:24px;color:#94a3b8;">Belum ada setoran pada bulan ini</div>';
        return;
      }

      container.innerHTML = riwayat.map((item, idx) => {
        const isLast = idx === riwayat.length - 1;
        const isSetor = item.status === 'setor' || item.tipe === 'setor';
        const titleText = formatDepositHistoryTitle(item);
        const subtitleText = formatDepositHistorySubtitle(item);

        if (isSetor) {
          return `
            <div class="list-item">
              <div class="list-item__left">
                <div class="list-item__icon list-item__icon--success list-item__icon--lg">
                  <span class="material-symbols-outlined" style="font-size:20px;">payments</span>
                </div>
                <div>
                  <p class="list-item__title" style="font-size:14px;font-weight:700;color:var(--on-surface);">${titleText}</p>
                  <p class="list-item__subtitle">${subtitleText}</p>
                </div>
              </div>
              <span class="font-financial-sm" style="color:var(--primary-container);font-weight:700;">+${formatRupiah(item.nominal)}</span>
            </div>
            ${isLast ? '' : '<hr class="list-divider">'}
          `;
        } else {
          return `
            <div class="list-item" style="opacity:0.75;">
              <div class="list-item__left">
                <div class="list-item__icon list-item__icon--surface list-item__icon--lg">
                  <span class="material-symbols-outlined" style="font-size:20px;">weekend</span>
                </div>
                <div>
                  <p class="list-item__title" style="font-size:14px;font-weight:700;color:#64748b;">${titleText}</p>
                  <p class="list-item__subtitle">${subtitleText}</p>
                </div>
              </div>
              <span class="font-financial-sm text-muted">Rp 0</span>
            </div>
            ${isLast ? '' : '<hr class="list-divider">'}
          `;
        }
      }).join('');
    }

    loadTenantMonthDetail();
  </script>
</body>
</html>
