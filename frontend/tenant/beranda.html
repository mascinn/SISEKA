<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda Tenant - SISEKA WASI'I</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-tenant">
  <div class="page-container">
    <!-- Top App Bar -->
    <header class="top-app-bar">
      <div class="top-app-bar__brand">
        <span class="material-symbols-outlined icon-fill top-app-bar__brand-icon">storefront</span>
        <div class="top-app-bar__brand-text">
          <span class="top-app-bar__title">SISEKA WASI'I</span>
          <span class="top-app-bar__subtitle">Sistem Informasi Sewa Kantin Wasi'i</span>
        </div>
      </div>
      <div class="avatar avatar--primary" id="userAvatar">BA</div>
    </header>

    <main style="padding:24px 16px 0;" class="space-y-6">
      <!-- Greeting -->
      <section class="px-2">
        <h2 class="text-xl font-bold" style="color:var(--on-surface);" id="greetingName">Hai 👋</h2>
        <p class="text-xs font-medium text-on-surface-variant" id="greetingKios">Kantin</p>
      </section>

      <!-- Hero Card -->
      <section class="hero-card hero-card--dark" style="padding:24px;">
        <div class="hero-card__decoration" style="top:0;right:0;width:128px;height:128px;background:rgba(255,255,255,0.05);filter:none;transform:translate(40px,-40px);"></div>
        <div class="hero-card__decoration" style="bottom:0;left:0;width:96px;height:96px;background:rgba(255,255,255,0.05);filter:none;transform:translate(-20px,40px);"></div>
        <div class="relative z-10">
          <p class="text-sm" style="color:var(--primary-fixed-dim);opacity:0.9;margin-bottom:4px;" id="heroMonthLabel">Akumulasi Setoran</p>
          <h1 class="hero-card__amount" style="letter-spacing:-0.025em;margin-bottom:24px;" id="heroTotalAkumulasi">Rp 0</h1>

          <div class="space-y-2 mb-6">
            <div class="flex justify-between items-end">
              <span class="font-label-caps" style="color:rgba(255,255,255,0.8);">PROGRESS</span>
              <span class="font-financial-sm font-bold text-white" id="heroProgressPercent">0%</span>
            </div>
            <div style="width:100%;background:var(--primary-container);border-radius:var(--radius-full);height:8px;overflow:hidden;">
              <div id="heroProgressBar" style="height:100%;border-radius:var(--radius-full);background:var(--primary-fixed);width:0%;transition:width 0.6s ease;"></div>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(0,0,0,0.1);backdrop-filter:blur(4px);border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,0.1);">
            <div class="flex flex-col">
              <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--primary-fixed-dim);margin-bottom:4px;">SEWA PER BULAN</span>
              <span class="font-financial-sm text-xs text-white" id="heroTarifSewa">Rp 0</span>
            </div>
            <div class="flex flex-col" style="border-left:1px solid rgba(255,255,255,0.1);padding-left:8px;">
              <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--primary-fixed-dim);margin-bottom:4px;" id="heroSisaLabel">KURANG</span>
              <span class="font-financial-sm text-xs text-white" id="heroSisaNominal">Rp 0</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Today's Status -->
      <section class="card" style="border-radius:16px;padding:16px;" id="todayStatusCard">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div id="todayStatusIconBox" style="width:40px;height:40px;border-radius:50%;background:rgba(236,253,245,0.3);display:flex;align-items:center;justify-content:center;border:1px solid var(--primary-fixed);">
              <span class="material-symbols-outlined icon-fill" style="color:var(--primary-container);">check_circle</span>
            </div>
            <div>
              <h3 class="font-title-md text-sm" style="color:var(--on-surface);">Setoran Hari Ini</h3>
              <p class="text-xs text-on-surface-variant" id="todayShortDate"></p>
            </div>
          </div>
          <div class="font-financial-sm" id="todayStatusAmount" style="color:var(--primary-container);font-weight:700;">--</div>
        </div>
      </section>

      <!-- Transaction History -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-title-md text-lg" style="color:var(--on-surface);">Riwayat Setoran Bulan Ini</h2>
        </div>

        <div class="card card--flush space-y-1" id="riwayatList">
          <div class="skeleton-card animate-fade-in" style="margin:8px;padding:12px;border-radius:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="skeleton" style="width:36px;height:36px;border-radius:50%;"></div>
                <div>
                  <div class="skeleton" style="width:120px;height:14px;margin-bottom:6px;"></div>
                  <div class="skeleton" style="width:80px;height:10px;"></div>
                </div>
              </div>
              <div class="skeleton" style="width:70px;height:16px;"></div>
            </div>
          </div>
          <div class="skeleton-card animate-fade-in" style="margin:8px;padding:12px;border-radius:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="skeleton" style="width:36px;height:36px;border-radius:50%;"></div>
                <div>
                  <div class="skeleton" style="width:110px;height:14px;margin-bottom:6px;"></div>
                  <div class="skeleton" style="width:75px;height:10px;"></div>
                </div>
              </div>
              <div class="skeleton" style="width:70px;height:16px;"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav bottom-nav--pill">
      <a href="beranda.html" class="bottom-nav__item active">
        <span class="material-symbols-outlined bottom-nav__icon">home</span>
        <span class="bottom-nav__label">Beranda</span>
      </a>
      <a href="rekap.html" class="bottom-nav__item">
        <span class="material-symbols-outlined bottom-nav__icon">calendar_month</span>
        <span class="bottom-nav__label">Rekap</span>
      </a>
      <a href="profil.html" class="bottom-nav__item">
        <span class="material-symbols-outlined bottom-nav__icon">person</span>
        <span class="bottom-nav__label">Profil</span>
      </a>
    </nav>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/components.js"></script>
  <script>
    const user = requireAuth('tenant');

    if (user) {
      document.getElementById('greetingName').textContent = `Hai, ${user.name} 👋`;
      document.getElementById('greetingKios').textContent = user.kios || 'Kantin';
      document.getElementById('userAvatar').textContent = user.initials || 'TN';
      document.getElementById('todayShortDate').textContent = getTodayShort();
    }

    // 1. Fetch Tenant Current Month Dashboard
    async function loadTenantDashboard() {
      const token = getAuthToken();
      if (!token) {
        window.location.href = '../login.html';
        return;
      }
      try {
        const res = await fetch(`${API_BASE_URL}/deposits/tenant/current`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();

        if (result.success) {
          renderTenantDashboard(result);
        } else {
          fallbackLocalTenant(result.message);
        }
      } catch (err) {
        console.warn('Backend offline / fetch error:', err);
        fallbackLocalTenant('Koneksi ke server terputus atau server sedang bangun (cold-start).');
      }
    }

    function fallbackLocalTenant(errorMessage) {
      document.getElementById('heroTotalAkumulasi').textContent = 'Rp 0';
      document.getElementById('heroProgressPercent').textContent = '0%';
      document.getElementById('heroProgressBar').style.width = '0%';
      document.getElementById('heroTarifSewa').textContent = 'Rp 0';
      document.getElementById('heroSisaLabel').textContent = 'STATUS';
      document.getElementById('heroSisaNominal').textContent = '-';

      const todayDateEl = document.getElementById('todayShortDate');
      const todayAmountEl = document.getElementById('todayStatusAmount');
      const todayIconBox = document.getElementById('todayStatusIconBox');

      todayDateEl.textContent = getTodayString();
      todayIconBox.innerHTML = '<span class="material-symbols-outlined" style="color:#ef4444;">cloud_off</span>';
      todayAmountEl.textContent = 'Gagal memuat';
      todayAmountEl.style.color = '#ef4444';

      const riwayatContainer = document.getElementById('riwayatList');
      riwayatContainer.innerHTML = `
        <div style="text-align:center;padding:28px 16px;background:var(--surface-container-low);border-radius:16px;border:1px dashed #cbd5e1;margin-top:8px;">
          <span class="material-symbols-outlined" style="font-size:36px;color:#ef4444;margin-bottom:6px;">cloud_off</span>
          <p style="font-size:14px;font-weight:700;color:var(--on-surface);margin-bottom:4px;">Gagal Memuat Data Server</p>
          <p style="font-size:12px;color:var(--on-surface-variant);margin-bottom:14px;">${errorMessage || 'Server sedang cold-start atau offline.'}</p>
          <button onclick="loadTenantDashboard()" style="padding:7px 18px;border-radius:20px;font-size:12px;font-weight:600;background:var(--primary);color:#fff;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
            <span class="material-symbols-outlined" style="font-size:16px;">refresh</span>Coba Muat Ulang
          </button>
        </div>
      `;
    }

    // 2. Render UI
    function renderTenantDashboard(data) {
      const { summary, deposit_today, riwayat } = data;

      // Month name
      const dateObj = new Date();
      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const monthLabel = `Akumulasi Setoran (${monthNames[dateObj.getMonth()]} ${dateObj.getFullYear()})`;
      document.getElementById('heroMonthLabel').textContent = monthLabel;

      // Hero metrics
      document.getElementById('heroTotalAkumulasi').textContent = formatRupiah(summary.total_akumulasi);
      document.getElementById('heroProgressPercent').textContent = `${summary.progress_percent}%`;
      document.getElementById('heroProgressBar').style.width = `${summary.progress_percent}%`;
      document.getElementById('heroTarifSewa').textContent = formatRupiah(summary.tarif_sewa);

      if (summary.surplus > 0) {
        document.getElementById('heroSisaLabel').textContent = 'SURPLUS';
        document.getElementById('heroSisaNominal').textContent = `+${formatRupiah(summary.surplus)}`;
      } else {
        document.getElementById('heroSisaLabel').textContent = 'KURANG';
        document.getElementById('heroSisaNominal').textContent = formatRupiah(summary.kekurangan);
      }

      // Today status banner
      const todayDateStr = getTodayString();
      const todayDateEl = document.getElementById('todayShortDate');
      const todayAmountEl = document.getElementById('todayStatusAmount');
      const todayIconBox = document.getElementById('todayStatusIconBox');

      if (deposit_today && deposit_today.status === 'setor') {
        const timePrefix = deposit_today.waktu ? `${deposit_today.waktu} WIB, ` : '';
        todayDateEl.textContent = `${timePrefix}${todayDateStr}`;
        todayIconBox.innerHTML = '<span class="material-symbols-outlined icon-fill" style="color:var(--primary-container);">check_circle</span>';
        todayAmountEl.textContent = `+${formatRupiah(deposit_today.nominal)}`;
        todayAmountEl.style.color = 'var(--primary-container)';
      } else if (deposit_today && deposit_today.status === 'libur') {
        todayDateEl.textContent = `${todayDateStr} • Libur`;
        todayIconBox.innerHTML = '<span class="material-symbols-outlined" style="color:#64748b;">bedtime</span>';
        todayAmountEl.textContent = 'Libur (Rp 0)';
        todayAmountEl.style.color = '#64748b';
      } else {
        todayDateEl.textContent = `${todayDateStr}`;
        todayIconBox.innerHTML = '<span class="material-symbols-outlined" style="color:#d97706;">hourglass_empty</span>';
        todayAmountEl.textContent = 'Menunggu';
        todayAmountEl.style.color = '#d97706';
      }

      // Riwayat List
      const riwayatContainer = document.getElementById('riwayatList');
      if (!riwayat || riwayat.length === 0) {
        riwayatContainer.innerHTML = '<div style="text-align:center;padding:24px;color:#94a3b8;">Belum ada setoran bulan ini</div>';
        return;
      }

      riwayatContainer.innerHTML = riwayat.map((item, idx) => {
        const isLast = idx === riwayat.length - 1;
        const isSetor = item.status === 'setor' || item.tipe === 'setor';
        const titleText = formatDepositHistoryTitle(item);
        const subtitleText = formatDepositHistorySubtitle(item);

        if (isSetor) {
          return `
            <div class="list-item animate-fade-in">
              <div class="list-item__left">
                <div class="list-item__icon list-item__icon--surface list-item__icon--lg">
                  <span class="material-symbols-outlined" style="font-size:20px;">payments</span>
                </div>
                <div>
                  <p class="list-item__title" style="font-size:14px;font-weight:700;color:var(--on-surface);">${titleText}</p>
                  <p class="list-item__subtitle">${subtitleText}</p>
                </div>
              </div>
              <span class="font-financial-sm" style="color:var(--primary-container);font-weight:700;">+${formatRupiah(item.nominal)}</span>
            </div>
            ${isLast ? '' : '<hr class="list-divider">'}
          `;
        } else {
          return `
            <div class="list-item animate-fade-in" style="opacity:0.75;">
              <div class="list-item__left">
                <div class="list-item__icon list-item__icon--surface list-item__icon--lg">
                  <span class="material-symbols-outlined" style="font-size:20px;">weekend</span>
                </div>
                <div>
                  <p class="list-item__title" style="font-size:14px;font-weight:700;color:#64748b;">${titleText}</p>
                  <p class="list-item__subtitle">${subtitleText}</p>
                </div>
              </div>
              <span class="font-financial-sm text-muted">Rp 0</span>
            </div>
            ${isLast ? '' : '<hr class="list-divider">'}
          `;
        }
      }).join('');
    }

    loadTenantDashboard();
  </script>
</body>
</html>
