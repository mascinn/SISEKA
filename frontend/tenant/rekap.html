<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Bulanan - SISEKA WASI'I</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-tenant">
  <div class="page-container">
    <!-- Top App Bar -->
    <header class="top-app-bar">
      <div class="top-app-bar__brand">
        <span class="material-symbols-outlined icon-fill top-app-bar__brand-icon">storefront</span>
        <div class="top-app-bar__brand-text">
          <span class="top-app-bar__title">SISEKA WASI'I</span>
          <span class="top-app-bar__subtitle">Sistem Informasi Sewa Kantin Wasi'i</span>
        </div>
      </div>
      <div class="avatar avatar--primary" id="userAvatar">BA</div>
    </header>

    <main style="padding:24px 16px 0;" class="space-y-6">
      <!-- Header -->
      <section>
        <h2 class="font-headline-lg-mobile font-bold" style="font-size:20px;color:#0f172a;">Rekap Pembayaran Bulanan</h2>
        <p class="text-sm font-medium text-on-surface-variant mt-1">Riwayat pencatatan dan status sewa per periode</p>
      </section>

      <!-- Year Filter -->
      <section class="filter-chips" id="yearFilterChips">
        <button class="chip chip--primary" data-year="2026" style="padding:10px 20px;font-size:14px;">Tahun 2026</button>
        <button class="chip" data-year="2025" style="padding:10px 20px;font-size:14px;background:rgba(255,255,255,0.8);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.6);color:var(--on-surface-variant);">Tahun 2025</button>
      </section>

      <!-- Monthly Cards Container -->
      <section class="space-y-4" id="monthlyCardsContainer">
        <div style="text-align:center;padding:24px;color:var(--on-surface-variant);">Memuat data rekap bulanan...</div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav bottom-nav--pill">
      <a href="beranda.html" class="bottom-nav__item">
        <span class="material-symbols-outlined bottom-nav__icon">home</span>
        <span class="bottom-nav__label">Beranda</span>
      </a>
      <a href="rekap.html" class="bottom-nav__item active">
        <span class="material-symbols-outlined bottom-nav__icon">calendar_month</span>
        <span class="bottom-nav__label">Rekap</span>
      </a>
      <a href="profil.html" class="bottom-nav__item">
        <span class="material-symbols-outlined bottom-nav__icon">person</span>
        <span class="bottom-nav__label">Profil</span>
      </a>
    </nav>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/components.js"></script>
  <script>
    const user = requireAuth('tenant');
    if (user) {
      document.getElementById('userAvatar').textContent = user.initials || 'TN';
    }

    let selectedYear = '2026';

    async function loadTenantRecap(year) {
      selectedYear = year;
      const token = getAuthToken();
      try {
        const res = await fetch(`${API_BASE_URL}/recap/tenant/monthly-history?year=${year}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();

        if (result.success) {
          renderTenantMonthlyCards(result.data);
        } else {
          fallbackLocalTenantRecap();
        }
      } catch (err) {
        console.warn('Backend offline, fallback lokal:', err);
        fallbackLocalTenantRecap();
      }
    }

    function fallbackLocalTenantRecap() {
      renderTenantMonthlyCards([
        {
          bulan_code: '2026-08',
          bulan_label: 'Agustus 2026',
          status: 'berjalan',
          total_setor: 850000,
          tarif_sewa: 1000000,
          progress_percent: 85,
          kekurangan: 150000,
          hari_aktif: 17,
          hari_libur: 2
        },
        {
          bulan_code: '2026-07',
          bulan_label: 'Juli 2026',
          status: 'surplus',
          total_setor: 1100000,
          tarif_sewa: 1000000,
          selisih: 100000,
          hari_aktif: 22,
          hari_libur: 9
        }
      ]);
    }

    function renderTenantMonthlyCards(list) {
      const container = document.getElementById('monthlyCardsContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:24px;color:#94a3b8;">Belum ada data rekap untuk tahun ini</div>';
        return;
      }

      container.innerHTML = list.map(item => {
        let badgeHtml = '';
        let thirdBoxHtml = '';

        if (item.status === 'surplus' || item.status === 'lunas') {
          badgeHtml = `
            <span style="background:#003820;color:#ffffff;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="font-size:16px;">check_circle</span> Lunas (Surplus)
            </span>
          `;
          thirdBoxHtml = `
            <div style="background:#f0fdf4;border:1px solid #dcfce7;border-radius:12px;padding:8px 12px;text-align:left;">
              <p style="font-size:10px;font-weight:700;color:#047857;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">SALDO</p>
              <p style="font-size:14px;font-weight:800;color:#047857;">+${formatRupiahShort(item.selisih || 0)}</p>
            </div>
          `;
        } else if (item.status === 'berjalan') {
          badgeHtml = `
            <span style="background:#f0fdf4;color:#047857;border:1px solid #bbf7d0;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="font-size:16px;">schedule</span> Berjalan (${item.progress_percent}%)
            </span>
          `;
          thirdBoxHtml = `
            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px 12px;text-align:left;">
              <p style="font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">SISA</p>
              <p style="font-size:14px;font-weight:800;color:#003820;">${formatRupiahShort(item.kekurangan || 0)}</p>
            </div>
          `;
        } else { // Kurang
          badgeHtml = `
            <span style="background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="font-size:16px;">error_outline</span> Kurang ${formatRupiahShort(Math.abs(item.selisih))}
            </span>
          `;
          thirdBoxHtml = `
            <div style="background:#fef2f2;border:1px solid #fee2e2;border-radius:12px;padding:8px 12px;text-align:left;">
              <p style="font-size:10px;font-weight:700;color:#b91c1c;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">SELISIH</p>
              <p style="font-size:14px;font-weight:800;color:#b91c1c;">-${formatRupiahShort(Math.abs(item.selisih))}</p>
            </div>
          `;
        }

        return `
          <div class="card" style="border-radius:24px;padding:20px;background:#ffffff;box-shadow:var(--shadow-sm);border:1px solid rgba(192,201,192,0.3);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
              <h3 style="font-size:18px;font-weight:800;color:#003820;margin:0;">${item.bulan_label}</h3>
              ${badgeHtml}
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:10px;align-items:center;margin-bottom:16px;">
              <div>
                <p style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">TERKUMPUL</p>
                <p style="font-size:15px;font-weight:800;color:#003820;">${formatRupiahShort(item.total_setor)}</p>
              </div>
              <div>
                <p style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">SEWA</p>
                <p style="font-size:15px;font-weight:800;color:#334155;">${formatRupiahShort(item.tarif_sewa)}</p>
              </div>
              ${thirdBoxHtml}
            </div>

            <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b;font-weight:500;margin-bottom:16px;">
              <span class="material-symbols-outlined" style="font-size:16px;">info</span>
              <span>${item.hari_aktif} Hari Aktif Setor • ${item.hari_libur} Hari Libur</span>
            </div>

            <a href="rekap-detail.html?month=${item.bulan_code}" class="btn btn--block" style="background:#003820;color:#ffffff;border-radius:9999px;padding:12px;font-size:14px;font-weight:700;text-align:center;text-decoration:none;box-shadow:var(--shadow-sm);transition:opacity 0.2s;">
              Lihat Rekap Detail
            </a>
          </div>
        `;
      }).join('');
    }

    // Year Filter Buttons
    document.querySelectorAll('#yearFilterChips .chip').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#yearFilterChips .chip').forEach(b => {
          b.classList.remove('chip--primary');
          b.style.background = 'rgba(255,255,255,0.8)';
          b.style.color = 'var(--on-surface-variant)';
        });
        this.classList.add('chip--primary');
        this.style.background = '';
        this.style.color = '';

        const yr = this.getAttribute('data-year');
        loadTenantRecap(yr);
      });
    });

    loadTenantRecap('2026');
  </script>
</body>
</html>
