<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Bulanan - SISEKA WASI'I</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-tenant">
  <div class="page-container">
    <!-- Top App Bar -->
    <header class="top-app-bar">
      <div class="top-app-bar__brand">
        <span class="material-symbols-outlined icon-fill top-app-bar__brand-icon">storefront</span>
        <div class="top-app-bar__brand-text">
          <span class="top-app-bar__title">SISEKA WASI'I</span>
          <span class="top-app-bar__subtitle">Sistem Informasi Sewa Kantin</span>
        </div>
      </div>
      <div class="avatar avatar--primary" id="userAvatar">BA</div>
    </header>

    <main style="padding:24px 16px 0;" class="space-y-6">
      <!-- Header -->
      <section>
        <h2 class="font-headline-lg-mobile font-bold" style="font-size:20px;color:#0f172a;">Rekap Pembayaran Bulanan</h2>
        <p class="text-sm font-medium text-on-surface-variant mt-1">Riwayat pencatatan dan status sewa per periode</p>
      </section>

      <!-- Year Filter -->
      <section class="filter-chips" id="yearFilterChips">
        <button class="chip chip--primary" data-year="2026" style="padding:10px 20px;font-size:14px;">Tahun 2026</button>
        <button class="chip" data-year="2025" style="padding:10px 20px;font-size:14px;background:rgba(255,255,255,0.8);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.6);color:var(--on-surface-variant);">Tahun 2025</button>
      </section>

      <!-- Monthly Cards Container -->
      <section class="space-y-4" id="monthlyCardsContainer">
        <div style="text-align:center;padding:24px;color:var(--on-surface-variant);">Memuat data rekap bulanan...</div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav bottom-nav--pill">
      <a href="beranda.html" class="bottom-nav__item">
        <span class="material-symbols-outlined bottom-nav__icon">home</span>
        <span class="bottom-nav__label">Beranda</span>
      </a>
      <a href="rekap.html" class="bottom-nav__item active">
        <span class="material-symbols-outlined bottom-nav__icon">calendar_month</span>
        <span class="bottom-nav__label">Rekap</span>
      </a>
      <a href="profil.html" class="bottom-nav__item">
        <span class="material-symbols-outlined bottom-nav__icon">person</span>
        <span class="bottom-nav__label">Profil</span>
      </a>
    </nav>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const user = requireAuth('tenant');
    if (user) {
      document.getElementById('userAvatar').textContent = user.initials || 'TN';
    }

    let selectedYear = '2026';

    async function loadTenantRecap(year) {
      selectedYear = year;
      const token = getAuthToken();
      try {
        const res = await fetch(`${API_BASE_URL}/recap/tenant/monthly-history?year=${year}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();

        if (result.success) {
          renderTenantMonthlyCards(result.data);
        } else {
          fallbackLocalTenantRecap();
        }
      } catch (err) {
        console.warn('Backend offline, fallback lokal:', err);
        fallbackLocalTenantRecap();
      }
    }

    function fallbackLocalTenantRecap() {
      renderTenantMonthlyCards([
        {
          bulan_code: '2026-08',
          bulan_label: 'Agustus 2026',
          status: 'berjalan',
          total_setor: 850000,
          tarif_sewa: 1000000,
          progress_percent: 85,
          kekurangan: 150000,
          hari_aktif: 17,
          hari_libur: 0
        },
        {
          bulan_code: '2026-07',
          bulan_label: 'Juli 2026',
          status: 'surplus',
          total_setor: 1100000,
          tarif_sewa: 1000000,
          selisih: 100000,
          hari_aktif: 22,
          hari_libur: 9
        },
        {
          bulan_code: '2026-06',
          bulan_label: 'Juni 2026',
          status: 'kurang',
          total_setor: 950000,
          tarif_sewa: 1000000,
          selisih: -50000,
          hari_aktif: 19,
          hari_libur: 11
        }
      ]);
    }

    function renderTenantMonthlyCards(list) {
      const container = document.getElementById('monthlyCardsContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:24px;color:#94a3b8;">Belum ada data rekap untuk tahun ini</div>';
        return;
      }

      container.innerHTML = list.map(item => {
        if (item.status === 'berjalan') {
          return `
            <div class="card" style="border-radius:var(--radius-3xl);padding:20px;">
              <div class="month-card__header">
                <h3 class="month-card__title">${item.bulan_label}</h3>
                <span class="badge badge--running">
                  <span class="badge__dot badge__dot--pulse"></span> Berjalan
                </span>
              </div>
              <div class="month-card__grid mb-5">
                <div>
                  <p class="month-card__stat-label">Total Setor</p>
                  <p class="month-card__stat-value" style="color:var(--primary);">${formatRupiah(item.total_setor)}</p>
                </div>
                <div>
                  <p class="month-card__stat-label">Biaya Sewa</p>
                  <p class="month-card__stat-value">${formatRupiah(item.tarif_sewa)}</p>
                </div>
              </div>
              <div class="space-y-2 mb-5">
                <div class="flex justify-between" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--on-surface-variant);">
                  <span>Progress (${item.progress_percent}%)</span>
                  <span style="color:var(--error);">${item.kekurangan > 0 ? 'Kurang ' + formatRupiah(item.kekurangan) + ' lagi' : 'Lunas'}</span>
                </div>
                <div class="progress-bar progress-bar--light" style="height:8px;">
                  <div class="progress-bar__fill" style="width:${item.progress_percent}%;background:var(--primary);"></div>
                </div>
              </div>
              <a href="rekap-detail.html?month=${item.bulan_code}" class="btn btn--primary btn--block btn--rounded" style="padding:12px;">
                Lihat Rekap Detail
                <span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span>
              </a>
            </div>
          `;
        } else if (item.status === 'surplus' || item.status === 'lunas') {
          return `
            <div class="card" style="border-radius:var(--radius-3xl);padding:20px;">
              <div class="month-card__header">
                <h3 class="month-card__title">${item.bulan_label}</h3>
                <span class="badge badge--lunas">
                  <span class="material-symbols-outlined" style="font-size:14px;">check_circle</span> Lunas (Surplus)
                </span>
              </div>
              <div class="month-card__grid--3 mb-4">
                <div>
                  <p class="month-card__stat-label">Terkumpul</p>
                  <p class="month-card__stat-value text-sm" style="color:var(--primary);">${formatRupiahShort(item.total_setor)}</p>
                </div>
                <div>
                  <p class="month-card__stat-label">Sewa</p>
                  <p class="month-card__stat-value text-sm">${formatRupiahShort(item.tarif_sewa)}</p>
                </div>
                <div style="padding-left:12px;border-left:1px solid rgba(192,201,192,0.3);background:#f0fdfa;border-radius:8px;padding:6px;">
                  <p class="month-card__stat-label" style="color:#0f766e;">Saldo</p>
                  <p class="month-card__stat-value text-sm font-bold" style="color:#0f766e;">+${formatRupiahShort(item.selisih || 0)}</p>
                </div>
              </div>
              <div class="month-card__info mb-5">
                <span class="material-symbols-outlined" style="font-size:14px;">info</span>
                ${item.hari_aktif} Hari Aktif Setor • ${item.hari_libur} Hari Libur
              </div>
              <a href="rekap-detail.html?month=${item.bulan_code}" class="btn btn--primary btn--block btn--rounded" style="padding:12px;">
                Lihat Rekap Detail
              </a>
            </div>
          `;
        } else { // Kurang
          return `
            <div class="card" style="border-radius:var(--radius-3xl);padding:20px;">
              <div class="month-card__header">
                <h3 class="month-card__title">${item.bulan_label}</h3>
                <span class="badge badge--kurang">
                  <span class="material-symbols-outlined" style="font-size:14px;">warning</span> Kurang ${formatRupiah(Math.abs(item.selisih))}
                </span>
              </div>
              <div class="month-card__grid--3 mb-4">
                <div>
                  <p class="month-card__stat-label">Terkumpul</p>
                  <p class="month-card__stat-value text-sm" style="color:var(--primary);">${formatRupiahShort(item.total_setor)}</p>
                </div>
                <div>
                  <p class="month-card__stat-label">Sewa</p>
                  <p class="month-card__stat-value text-sm">${formatRupiahShort(item.tarif_sewa)}</p>
                </div>
                <div style="padding-left:12px;border-left:1px solid rgba(192,201,192,0.3);background:#fef2f2;border-radius:8px;padding:6px;">
                  <p class="month-card__stat-label" style="color:#b91c1c;">Selisih</p>
                  <p class="month-card__stat-value text-sm font-bold" style="color:#b91c1c;">-${formatRupiahShort(Math.abs(item.selisih))}</p>
                </div>
              </div>
              <div class="month-card__info mb-5">
                <span class="material-symbols-outlined" style="font-size:14px;">info</span>
                ${item.hari_aktif} Hari Aktif Setor • ${item.hari_libur} Hari Libur/Izin
              </div>
              <a href="rekap-detail.html?month=${item.bulan_code}" class="btn btn--primary btn--block btn--rounded" style="padding:12px;">
                Lihat Rekap Detail
              </a>
            </div>
          `;
        }
      }).join('');
    }

    // Year Filter Buttons
    document.querySelectorAll('#yearFilterChips .chip').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#yearFilterChips .chip').forEach(b => {
          b.classList.remove('chip--primary');
          b.style.background = 'rgba(255,255,255,0.8)';
          b.style.color = 'var(--on-surface-variant)';
        });
        this.classList.add('chip--primary');
        this.style.background = '';
        this.style.color = '';

        const yr = this.getAttribute('data-year');
        loadTenantRecap(yr);
      });
    });

    loadTenantRecap('2026');
  </script>
</body>
</html>
