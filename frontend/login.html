<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SISEKA WASI'I</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-login">
  <div class="login-container">
    <!-- Header Section -->
    <header class="login-header">
      <div class="login-logo">
        <span class="material-symbols-outlined icon-fill" style="font-size:32px;">mosque</span>
      </div>
      <h1 class="font-headline-lg-mobile" style="color:#0f172a;">SISEKA WASI'I</h1>
      <p class="text-xs text-muted" style="max-width:250px;line-height:1.6;margin-top:8px;">
        Sistem Informasi Setoran Sewa Kantin<br>BPH Masjid Al-Wasi'i
      </p>
    </header>

    <!-- Login Card -->
    <main style="flex:1;display:flex;flex-direction:column;align-items:center;width:100%;padding:0 16px;">
      <div class="login-card">
        <form id="loginForm" class="space-y-4">
          <!-- Username -->
          <div class="input-group">
            <label class="input-label" for="username">Username</label>
            <div class="input-wrap">
              <span class="material-symbols-outlined input-wrap__icon">person</span>
              <input id="username" type="text" class="input" placeholder="admin" autocomplete="username" required>
            </div>
          </div>
          <!-- Password -->
          <div class="input-group">
            <label class="input-label" for="password">Password</label>
            <div class="input-wrap">
              <span class="material-symbols-outlined input-wrap__icon">lock</span>
              <input id="password" type="password" class="input" style="padding-right:48px;" placeholder="Masukkan password Anda" autocomplete="current-password" required>
              <button type="button" class="input-wrap__action" onclick="togglePassword('password', this)">
                <span class="material-symbols-outlined" style="font-size:20px;">visibility_off</span>
              </button>
            </div>
          </div>
          <!-- Error Message -->
          <div id="loginError" class="hidden" style="background:#fef2f2;color:#dc2626;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;border:1px solid #fecaca;">
            Username atau password salah
          </div>
          <!-- Submit -->
          <button type="submit" class="btn btn--primary-dark btn--block btn--lg" style="margin-top:24px;border-radius:12px;">
            Masuk ke Sistem
            <span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span>
          </button>
        </form>
        <!-- Support -->
        <div class="text-center mt-6">
          <p class="text-sm text-muted mb-1">Lupa akun atau butuh akses baru?</p>
          <a href="#" class="text-sm font-bold text-primary-container" style="transition:color 0.15s;">Hubungi Pengurus BPH</a>
        </div>
      </div>

      <!-- Demo Credentials -->
      <div style="margin-top:24px;background:rgba(255,255,255,0.7);border-radius:16px;padding:16px;max-width:400px;width:100%;border:1px solid rgba(255,255,255,0.8);">
        <p class="font-label-caps text-on-surface-variant mb-2" style="font-size:10px;">AKUN DEMO</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button type="button" onclick="fillDemo('admin','1234')" class="btn btn--sm btn--ghost" style="border-radius:10px;font-size:11px;">
            <span class="material-symbols-outlined" style="font-size:16px;">admin_panel_settings</span>
            Admin
          </button>
          <button type="button" onclick="fillDemo('aminah','1234')" class="btn btn--sm btn--ghost" style="border-radius:10px;font-size:11px;">
            <span class="material-symbols-outlined" style="font-size:16px;">storefront</span>
            Bu Aminah
          </button>
          <button type="button" onclick="fillDemo('hidayat','1234')" class="btn btn--sm btn--ghost" style="border-radius:10px;font-size:11px;">
            <span class="material-symbols-outlined" style="font-size:16px;">print</span>
            Pak Hidayat
          </button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="login-footer" style="text-align:center;padding:24px 16px 32px;width:100%;">
      <p class="font-label-caps text-on-surface-variant" style="font-size:11px;margin-bottom:6px;letter-spacing:0.05em;">SISEKA WASI'I • Versi 2.0.0</p>
      <p style="font-size:12px;color:#64748b;margin:0 0 12px 0;">
        Dikembangkan dengan dedikasi oleh <strong style="color:#003820;font-weight:700;">mascinnn</strong>
      </p>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;">
        <a href="https://instagram.com/mascinnn" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;color:#334155;text-decoration:none;font-size:12px;font-weight:600;background:#ffffff;padding:6px 14px;border-radius:9999px;border:1px solid rgba(0,0,0,0.08);box-shadow:var(--shadow-sm);transition:all 0.15s ease;">
          <svg style="width:14px;height:14px;fill:#E1306C;" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          <span>Instagram</span>
        </a>
        <a href="https://linkedin.com/in/mascinnn" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;color:#334155;text-decoration:none;font-size:12px;font-weight:600;background:#ffffff;padding:6px 14px;border-radius:9999px;border:1px solid rgba(0,0,0,0.08);box-shadow:var(--shadow-sm);transition:all 0.15s ease;">
          <svg style="width:14px;height:14px;fill:#0A66C2;" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          <span>LinkedIn</span>
        </a>
      </div>
    </footer>
  </div>

  <script src="js/app.js"></script>
  <script src="js/components.js"></script>
  <script>
    // If already logged in, redirect
    const user = getCurrentUser();
    if (user) {
      window.location.href = user.role === 'admin' ? 'admin/penarikan.html' : 'tenant/beranda.html';
    }

    // Fill demo credentials
    function fillDemo(username, password) {
      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
    }

    // Login handler
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('loginError');

      const submitBtn = this.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      try {
        const user = await login(username, password);
        if (user) {
          errorEl.classList.add('hidden');
          if (user.role === 'admin') {
            window.location.href = 'admin/penarikan.html';
          } else {
            window.location.href = 'tenant/beranda.html';
          }
        } else {
          errorEl.classList.remove('hidden');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '';
      }
    });
  </script>
</body>
</html>
